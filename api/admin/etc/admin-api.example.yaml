Name: admin-api
Host: 0.0.0.0
Port: 9421
Timeout: 5000
# 健康检查
DevServer:
  Enabled: true
  Port: 6061
  HealthPath: "/ping"
  MetricsPath: "/metrics"
  EnableMetrics: true
# 日志配置
Log:
  Mode: file
  Encoding: json
  Path: runtime/admin-api/log
# 文件上传配置
StorageConfig:
  Provider: minio
  Minio:
    Endpoint: 127.0.0.1:9000
    Bucket: blog
    AccessKey: veweiyi
    SecretKey: minio7914
    Secure: false

RedisConf:
  db: 0
  host: localhost
  port: "6379"
  password: redis7914

# etcd模式
# AppRpcConf:
#   Etcd:
#     Hosts:
#      - "localhost:2379"
#     Key: "blog/app.rpc"
#     User: "root"
#     Pass: "etcd7914"
#   NonBlock: true
#   Timeout: 5000

# 直连模式
AppRpcConf:
  Endpoints:
    - localhost:9120
  Timeout: 5000
